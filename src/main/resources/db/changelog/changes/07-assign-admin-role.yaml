
databaseChangeLog:
  - changeSet:
      id: 07-assign-admin-role
      author: aroslav
      changes:
        - sql:
            sql: |
              INSERT INTO users_roles (user_id, role_id)
              SELECT
                  users.id,
                  roles.id
              FROM users
              CROSS JOIN roles
              WHERE users.email = 'user@example.com'
                AND roles.name = 'ADMIN';
